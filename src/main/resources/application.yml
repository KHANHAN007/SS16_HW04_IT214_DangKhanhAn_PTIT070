server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/products;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s
product:
  cache-ttl: 60s
